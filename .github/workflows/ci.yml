name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上的新提交会取消尚未跑完的旧任务，避免排队浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: 安装后端依赖
        run: pip install -r api/requirements.txt

      # 必须在 api/ 目录下运行：测试用例里是 `import main`，
      # 依赖当前工作目录进入 sys.path 才能找到 main.py。
      # -p "test_*.py" 会跳过 online_e2e.py——那个要连真实后端和 API key，
      # 不能在 CI 里跑。
      - name: 运行后端回归
        working-directory: api
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    name: 前端回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json

      - name: 检查 index.html 内联脚本语法
        run: |
          sed -n '/^  <script>$/,/^<\/script>$/p' index.html | sed '1d;$d' > /tmp/inline.js
          node --check /tmp/inline.js

      - name: 安装测试依赖
        working-directory: tests/frontend
        run: npm ci

      - name: 安装 Chromium
        working-directory: tests/frontend
        run: npx playwright install --with-deps chromium

      # 不设置 CHROMIUM_PATH，用上一步装好的默认浏览器。
      - name: 运行前端回归
        working-directory: tests/frontend
        run: npm test
